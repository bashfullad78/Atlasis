# CI for the offline test suite.
#
# Runs on every push to main and every pull request. The suite is offline by
# design; the four real-cache pins (tests/test_hospital_curation_kyoto.py)
# skip automatically when the gitignored data/raw caches are absent (fresh
# checkout) and run wherever the caches exist.

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run offline test suite
        run: python -m pytest tests/ -q -ra
